[package]
name = "l337-audio-server"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.7.9"
tokio = { version = "1.43.0", features = ["full"] }
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.138"
rodio = { version = "0.20.1", features = ["symphonia-mp3", "symphonia-isomp4", "symphonia-flac", "symphonia-vorbis"] }
walkdir = "2.5.0"
dirs = "6.0.0"
chrono = { version = "0.4.39", features = ["serde"] }
config = "0.15.7"
reqwest = { version = "0.12.12", features = ["stream"] }
futures-util = "0.3.31"
tower-http = { version = "0.6.2", features = ["cors", "trace"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
