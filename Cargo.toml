[package]
name = "l337-audio-server"
version = "0.1.0"
edition = "2024"

[features]
default = ["backend"]
backend = ["pipewire", "coreaudio-rs", "wasapi"]
alsa = []
pulseaudio = ["backend"]

[dependencies]
axum = "0.7.9"
tokio = { version = "1.43.0", features = ["full"] }
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.138"
symphonia = { version = "0.5", features = ["mp3", "aac", "flac", "vorbis", "wav", "isomp4", "ogg"] }
rubato = "0.14"
wsola = "0.1.0"
pitch_shift = "2.1"
async-trait = "0.1.86"
libloading = "0.8.6"
walkdir = "2.5.0"
dirs = "6.0.0"
chrono = { version = "0.4.39", features = ["serde"] }
config = "0.15.7"
reqwest = { version = "0.12.12", features = ["stream", "rustls-tls", "json"], default-features = false }
futures-util = "0.3.31"
tower = "0.5"
tower-http = { version = "0.6.2", features = ["cors", "trace", "limit"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
axum-server = { version = "0.8", features = ["tls-rustls"] }
rustls = { version = "0.23", features = ["ring"] }
rcgen = "0.13"
rand = "0.8"
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
pipewire = { version = "0.10", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
coreaudio-rs = { version = "0.10", optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
wasapi = { version = "0.10", optional = true }
