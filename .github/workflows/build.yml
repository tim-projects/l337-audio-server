name: Build Release Binaries

on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      target:
        description: 'Build target (or "all")'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - x86_64-linux-pipewire
          - x86_64-linux-alsa
          - x86_64-pc-windows-msvc
          - x86_64-apple-darwin
          - aarch64-apple-darwin
          - aarch64-linux-pipewire
          - aarch64-linux-alsa
          - aarch64-linux-android
          - armv7-linux-alsa
          - riscv64-linux-alsa

env:
  CARGO_TERM_COLOR: always
  # glibc floor of the released Linux binaries — the glibc of the pinned build
  # image below, and the oldest glibc the released binaries can run on. Every
  # Linux release asset is named with this value:
  #     l337-audio-server-<arch>-linux-<variant>-glibc2.36
  # so the installer can match it against the system's glibc and install the
  # newest release the system can run. Bump this ONLY together with the image
  # in the Linux jobs below: the "Check glibc compatibility" step fails the
  # build if the binary actually requires a newer glibc than declared here.
  L337_GLIBC: "2.36"

concurrency:
  group: build-release
  cancel-in-progress: true

jobs:
  determine-version:
    name: Determine release version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.set_tag.outputs.tag }}
      version: ${{ steps.set_tag.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Set release tag
        id: set_tag
        env:
          GH_REPO: ${{ github.repository }}
        run: |
          TODAY=$(date -u +"%Y.%m.%d")
          echo "Today: $TODAY"

          EXISTING=$(
            {
              gh release list --repo "$GH_REPO" --limit 100 --json tagName --jq '.[].tagName';
              git ls-remote --tags origin | grep -oP "refs/tags/${TODAY}-\d+" | sed "s|refs/tags/${TODAY}-||";
            } | sed "s/^${TODAY}-//" | sort -V | tail -1 || true
          )

          if [ -z "$EXISTING" ]; then
              BUILD_NUM=1
          else
              BUILD_NUM=$((EXISTING + 1))
          fi

          TAG="${TODAY}-${BUILD_NUM}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Computed release tag: ${TAG}"

  # IMPORTANT: every glibc-linked Linux job builds inside this pinned image.
  # Do not build these binaries natively on the runner again. Release
  # 2026.10.26-4 was linked on ubuntu-latest (Ubuntu 26.04), toolchain defaults
  # had moved silently: GCC 16 now defaults to C23 mode, which makes glibc's
  # headers redirect `sscanf` to `__isoc23_sscanf` (glibc >= 2.38 only) and
  # rebind `atan2f` to GLIBC_2.43. The aws-lc-sys C code only calls plain
  # `sscanf`/`atan2f`, so the binary silently started requiring GLIBC_2.43 and
  # refused to start on any system with an older glibc (installer rolled back).
  # Debian 12 (bookworm) is frozen: glibc 2.36, GCC 12 (gnu17 default), PipeWire
  # 0.3.65. The released binaries then run on glibc >= 2.36 (Debian 12,
  # Ubuntu 24.04+, Fedora 40+, RHEL 10). The "Check glibc compatibility" step
  # below enforces that floor in CI so this can never regress silently again,
  # and every Linux asset this job publishes is named with the floor
  # (-glibc2.36) so the installer can match it against the system's glibc.
  build-linux:
    name: Build - x86_64-linux (${{ matrix.variant }})
    runs-on: ubuntu-latest
    container: rust:1.99.1-bookworm
    needs: determine-version
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.target == 'all' || github.event.inputs.target == 'x86_64-linux-pipewire' || github.event.inputs.target == 'x86_64-linux-alsa' }}
    strategy:
      matrix:
        variant: [pipewire, alsa]
        include:
          - variant: pipewire
            features: ""
            pkg_deps: libpipewire-0.3-dev libspa-0.2-dev
          - variant: alsa
            features: "--no-default-features --features alsa"
            pkg_deps: ""
    env:
      L337_VERSION: ${{ needs.determine-version.outputs.version }}
    steps:
    - uses: actions/checkout@v4
    - name: Install dependencies and Rust target
      run: |
        apt-get update
        apt-get install -y --no-install-recommends pkg-config ${{ matrix.pkg_deps }}
        rustup target add x86_64-unknown-linux-gnu
    - name: Build release binary
      run: cargo build --verbose --release --target x86_64-unknown-linux-gnu ${{ matrix.features }}
    - name: Check glibc compatibility
      run: |
        command -v readelf >/dev/null || { apt-get update && apt-get install -y --no-install-recommends binutils; }
        bash "$GITHUB_WORKSPACE/scripts/check-glibc.sh" "target/x86_64-unknown-linux-gnu/release/l337-audio-server" "$L337_GLIBC"
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: l337-audio-server-x86_64-linux-${{ matrix.variant }}-glibc${{ env.L337_GLIBC }}
        path: |
          target/x86_64-unknown-linux-gnu/release/l337-audio-server
        retention-days: 90

  build-windows:
    name: Build - x86_64-pc-windows-msvc
    runs-on: windows-latest
    needs: determine-version
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.target == 'all' || github.event.inputs.target == 'x86_64-pc-windows-msvc' }}
    continue-on-error: true
    env:
      L337_VERSION: ${{ needs.determine-version.outputs.version }}
    steps:
    - uses: actions/checkout@v4
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: x86_64-pc-windows-msvc
    - name: Build release binary
      run: cargo build --verbose --release --target x86_64-pc-windows-msvc --no-default-features
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: l337-audio-server-x86_64-pc-windows-msvc
        path: |
          target/x86_64-pc-windows-msvc/release/l337-audio-server.exe
        retention-days: 90

  build-macos:
    name: Build - x86_64-apple-darwin
    runs-on: macos-latest
    needs: determine-version
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.target == 'all' || github.event.inputs.target == 'x86_64-apple-darwin' }}
    continue-on-error: true
    env:
      L337_VERSION: ${{ needs.determine-version.outputs.version }}
    steps:
    - uses: actions/checkout@v4
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: x86_64-apple-darwin
    - name: Build release binary
      run: cargo build --verbose --release --target x86_64-apple-darwin
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: l337-audio-server-x86_64-apple-darwin
        path: |
          target/x86_64-apple-darwin/release/l337-audio-server
        retention-days: 90

  build-linux-arm64:
    name: Build - aarch64-linux (${{ matrix.variant }})
    runs-on: ubuntu-24.04-arm
    container: rust:1.99.1-bookworm
    needs: determine-version
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.target == 'all' || github.event.inputs.target == 'aarch64-linux-pipewire' || github.event.inputs.target == 'aarch64-linux-alsa' }}
    strategy:
      matrix:
        variant: [pipewire, alsa]
        include:
          - variant: pipewire
            features: ""
            pkg_deps: libpipewire-0.3-dev libspa-0.2-dev
          - variant: alsa
            features: "--no-default-features --features alsa"
            pkg_deps: ""
    env:
      L337_VERSION: ${{ needs.determine-version.outputs.version }}
    steps:
    - uses: actions/checkout@v4
    - name: Install dependencies and Rust target
      run: |
        apt-get update
        apt-get install -y --no-install-recommends pkg-config ${{ matrix.pkg_deps }}
        rustup target add aarch64-unknown-linux-gnu
    - name: Build release binary
      run: cargo build --verbose --release --target aarch64-unknown-linux-gnu ${{ matrix.features }}
    - name: Check glibc compatibility
      run: |
        command -v readelf >/dev/null || { apt-get update && apt-get install -y --no-install-recommends binutils; }
        bash "$GITHUB_WORKSPACE/scripts/check-glibc.sh" "target/aarch64-unknown-linux-gnu/release/l337-audio-server" "$L337_GLIBC"
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: l337-audio-server-aarch64-linux-${{ matrix.variant }}-glibc${{ env.L337_GLIBC }}
        path: |
          target/aarch64-unknown-linux-gnu/release/l337-audio-server
        retention-days: 90

  build-linux-arm32:
    name: Build - armv7-linux (alsa)
    runs-on: ubuntu-24.04-arm
    container: rust:1.99.1-bookworm
    needs: determine-version
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.target == 'all' || github.event.inputs.target == 'armv7-linux-alsa' }}
    env:
      L337_VERSION: ${{ needs.determine-version.outputs.version }}
      CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER: arm-linux-gnueabihf-gcc
      CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_AR: arm-linux-gnueabihf-ar
    steps:
    - uses: actions/checkout@v4
    - name: Install dependencies and Rust target
      run: |
        apt-get update
        apt-get install -y --no-install-recommends pkg-config gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf
        rustup target add armv7-unknown-linux-gnueabihf
    - name: Build release binary
      run: cargo build --verbose --release --target armv7-unknown-linux-gnueabihf --no-default-features --features alsa
    - name: Check glibc compatibility
      run: |
        command -v readelf >/dev/null || { apt-get update && apt-get install -y --no-install-recommends binutils; }
        bash "$GITHUB_WORKSPACE/scripts/check-glibc.sh" "target/armv7-unknown-linux-gnueabihf/release/l337-audio-server" "$L337_GLIBC"
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: l337-audio-server-armv7-linux-alsa-glibc${{ env.L337_GLIBC }}
        path: |
          target/armv7-unknown-linux-gnueabihf/release/l337-audio-server
        retention-days: 90

  build-linux-riscv64:
    name: Build - riscv64-linux (alsa)
    runs-on: ubuntu-24.04-arm
    container: rust:1.99.1-bookworm
    needs: determine-version
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.target == 'all' || github.event.inputs.target == 'riscv64-linux-alsa' }}
    env:
      L337_VERSION: ${{ needs.determine-version.outputs.version }}
      CARGO_TARGET_RISCV64GC_UNKNOWN_LINUX_GNU_LINKER: riscv64-linux-gnu-gcc
      CARGO_TARGET_RISCV64GC_UNKNOWN_LINUX_GNU_AR: riscv64-linux-gnu-ar
    steps:
    - uses: actions/checkout@v4
    - name: Install dependencies and Rust target
      run: |
        apt-get update
        apt-get install -y --no-install-recommends pkg-config gcc-riscv64-linux-gnu g++-riscv64-linux-gnu
        rustup target add riscv64gc-unknown-linux-gnu
    - name: Build release binary
      run: cargo build --verbose --release --target riscv64gc-unknown-linux-gnu --no-default-features --features alsa
    - name: Check glibc compatibility
      run: |
        command -v readelf >/dev/null || { apt-get update && apt-get install -y --no-install-recommends binutils; }
        bash "$GITHUB_WORKSPACE/scripts/check-glibc.sh" "target/riscv64gc-unknown-linux-gnu/release/l337-audio-server" "$L337_GLIBC"
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: l337-audio-server-riscv64-linux-alsa-glibc${{ env.L337_GLIBC }}
        path: |
          target/riscv64gc-unknown-linux-gnu/release/l337-audio-server
        retention-days: 90

  build-android:
    name: Build - aarch64-linux-android (${{ matrix.variant }})
    runs-on: ubuntu-latest
    needs: determine-version
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.target == 'all' || github.event.inputs.target == 'aarch64-linux-android' }}
    strategy:
      matrix:
        variant: [native, termux]
    env:
      L337_VERSION: ${{ needs.determine-version.outputs.version }}
    steps:
    - uses: actions/checkout@v4
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: aarch64-linux-android
    - name: Install Android NDK
      run: |
        sudo apt-get update
        sudo apt-get install -y unzip
        NDK_VERSION=r28b
        wget -q https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip
        unzip -q android-ndk-${NDK_VERSION}-linux.zip
        echo "$(pwd)/android-ndk-${NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH
        echo "CC_aarch64-linux-android=$(pwd)/android-ndk-${NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android29-clang" >> $GITHUB_ENV
        echo "CXX_aarch64-linux-android=$(pwd)/android-ndk-${NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android29-clang++" >> $GITHUB_ENV
        echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$(pwd)/android-ndk-${NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android29-clang" >> $GITHUB_ENV
    - name: Build release binary
      run: |
        if [ "${{ matrix.variant }}" = "termux" ]; then
          cargo build --verbose --release --target aarch64-linux-android --features pulseaudio
        else
          cargo build --verbose --release --target aarch64-linux-android
        fi
    # The termux variant links PulseAudio directly: build.rs links the stub in
    # scripts/pulse-stubs (SONAME libpulse.so) so the real library is mapped at
    # process start. This must NOT be dlopen'd: on bionic the dlopen path fails
    # client-side in pa_stream_new (PA_ERR_INVALID). See plan-android.md.
    # The run script must export LD_LIBRARY_PATH=$PREFIX/lib, because the
    # NDK-built binary has no runpath.
    - name: Verify PulseAudio linkage (termux)
      if: ${{ matrix.variant == 'termux' }}
      run: |
        BIN=target/aarch64-linux-android/release/l337-audio-server
        readelf -d "$BIN" | grep NEEDED
        if ! readelf -d "$BIN" | grep -q 'libpulse.so'; then
          echo "::error::termux binary is not linked against libpulse.so"
          exit 1
        fi
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.variant == 'native' && 'l337-audio-server-aarch64-android' || 'l337-audio-server-aarch64-android-termux' }}
        path: |
          target/aarch64-linux-android/release/l337-audio-server
        retention-days: 90

  build-macos-arm64:
    name: Build - aarch64-apple-darwin
    runs-on: macos-latest
    needs: determine-version
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.target == 'all' || github.event.inputs.target == 'aarch64-apple-darwin' }}
    continue-on-error: true
    env:
      L337_VERSION: ${{ needs.determine-version.outputs.version }}
    steps:
    - uses: actions/checkout@v4
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: aarch64-apple-darwin
    - name: Build release binary
      run: cargo build --verbose --release --target aarch64-apple-darwin
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: l337-audio-server-aarch64-apple-darwin
        path: |
          target/aarch64-apple-darwin/release/l337-audio-server
        retention-days: 90

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [determine-version, build-linux, build-windows, build-macos, build-macos-arm64, build-linux-arm64, build-linux-arm32, build-linux-riscv64, build-android]
    if: ${{ github.event_name != 'pull_request' && always() }}
    continue-on-error: true
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
    - uses: actions/checkout@v4
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: ./release-artifacts
    - name: Rename binaries with target triple
      run: |
        find ./release-artifacts -type f ! -name '*.d' | while read -r f; do
          dir=$(dirname "$f")
          base=$(basename "$f")
          target=$(basename "$dir")
          ext=""
          case "$base" in
            *.exe) ext=".exe" ;;
          esac
          newname="${target}${ext}"
          mv "$f" "$dir/$newname"
          echo "Renamed: $base -> $newname"
        done
    - name: Inspect downloaded artifacts
      run: |
        echo "Artifacts downloaded:"
        find ./release-artifacts -type f -exec ls -lh {} \;
    - name: Delete stale release/tag if exists
      run: |
        TAG="${{ needs.determine-version.outputs.tag }}"
        if gh release view "$TAG" >/dev/null 2>&1; then
          echo "Deleting stale release and tag $TAG"
          gh release delete "$TAG" --yes
        elif git ls-remote --tags origin | grep -q "refs/tags/${TAG}"; then
          echo "Deleting orphaned tag $TAG"
          git push origin --delete tag "$TAG"
        fi
    - name: Create GitHub Release
      run: |
        gh release create "${{ needs.determine-version.outputs.tag }}" \
          --title "L337 Audio Server ${{ needs.determine-version.outputs.tag }}" \
          --prerelease \
          --generate-notes \
          $(find ./release-artifacts -type f -printf '%p ')
