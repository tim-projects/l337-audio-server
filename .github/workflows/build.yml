name: Build Release Binaries

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      target:
        description: 'Build target (or "all")'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - x86_64-unknown-linux-gnu
          - x86_64-pc-windows-msvc
          - x86_64-apple-darwin
          - aarch64-linux-android

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux:
    name: Build - x86_64-unknown-linux-gnu
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.target == 'all' || github.event.inputs.target == 'x86_64-unknown-linux-gnu' }}
    steps:
    - uses: actions/checkout@v4
    - name: Install dependencies (Linux)
      run: |
        sudo apt-get update
        sudo apt-get install -y pkg-config libpipewire-0.3-dev libspa-0.2-dev
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: x86_64-unknown-linux-gnu
    - name: Build release binary
      run: cargo build --verbose --release --target x86_64-unknown-linux-gnu
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: l337-audio-server-x86_64-unknown-linux-gnu
        path: |
          target/x86_64-unknown-linux-gnu/release/l337-audio-server*
        retention-days: 90

  build-windows:
    name: Build - x86_64-pc-windows-msvc
    runs-on: windows-latest
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.target == 'all' || github.event.inputs.target == 'x86_64-pc-windows-msvc' }}
    steps:
    - uses: actions/checkout@v4
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: x86_64-pc-windows-msvc
    - name: Build release binary
      run: cargo build --verbose --release --target x86_64-pc-windows-msvc
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: l337-audio-server-x86_64-pc-windows-msvc
        path: |
          target/x86_64-pc-windows-msvc/release/l337-audio-server.exe
          target/x86_64-pc-windows-msvc/release/*.pdb
        retention-days: 90

  build-macos:
    name: Build - x86_64-apple-darwin
    runs-on: macos-latest
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.target == 'all' || github.event.inputs.target == 'x86_64-apple-darwin' }}
    steps:
    - uses: actions/checkout@v4
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: x86_64-apple-darwin
    - name: Build release binary
      run: cargo build --verbose --release --target x86_64-apple-darwin
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: l337-audio-server-x86_64-apple-darwin
        path: |
          target/x86_64-apple-darwin/release/l337-audio-server*
        retention-days: 90

  build-android:
    name: Build - aarch64-linux-android
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.target == 'all' || github.event.inputs.target == 'aarch64-linux-android' }}
    steps:
    - uses: actions/checkout@v4
    - name: Setup Android NDK
      run: |
        echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV
        rustup target add aarch64-linux-android
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: aarch64-linux-android
    - name: Build release binary
      run: cargo build --verbose --release --target aarch64-linux-android
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: l337-audio-server-aarch64-linux-android
        path: |
          target/aarch64-linux-android/release/l337-audio-server*
        retention-days: 90

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build-linux, build-windows, build-macos, build-android]
    if: ${{ github.event_name != 'pull_request' && always() }}
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    - name: Set release tag
      id: release_tag
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          echo "tag=nightly-${{ github.run_number }}" >> $GITHUB_OUTPUT
          echo "name=Nightly Build #${{ github.run_number }}" >> $GITHUB_OUTPUT
        else
          echo "tag=nightly-${{ github.sha }}" >> $GITHUB_OUTPUT
          echo "name=Nightly Build ${{ github.sha }}" >> $GITHUB_OUTPUT
        fi
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: ./release-artifacts
    - name: Rename binaries with target triple
      run: |
        find ./release-artifacts -type f ! -name '*.d' | while read -r f; do
          dir=$(dirname "$f")
          base=$(basename "$f")
          target=$(basename "$dir")
          ext=""
          case "$base" in
            *.exe) ext=".exe" ;;
          esac
          newname="${target}${ext}"
          mv "$f" "$dir/$newname"
          echo "Renamed: $base -> $newname"
        done
    - name: Inspect downloaded artifacts
      run: |
        echo "Artifacts downloaded:"
        find ./release-artifacts -type f -exec ls -lh {} \;
    - name: Create GitHub Release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release create "${{ steps.release_tag.outputs.tag }}" \
          --title "${{ steps.release_tag.outputs.name }}" \
          --prerelease \
          --generate-notes \
          $(find ./release-artifacts -type f -printf '%p ')
