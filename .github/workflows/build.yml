name: Build Release Binaries

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      target:
        description: 'Build target (or "all")'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - x86_64-linux-pipewire
          - x86_64-linux-alsa
          - x86_64-pc-windows-msvc
          - x86_64-apple-darwin
          - aarch64-linux-android

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: build-release
  cancel-in-progress: true

jobs:
  build-linux:
    name: Build - x86_64-linux (${{ matrix.variant }})
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.target == 'all' || github.event.inputs.target == 'x86_64-linux-pipewire' || github.event.inputs.target == 'x86_64-linux-alsa' }}
    strategy:
      matrix:
        variant: [pipewire, alsa]
        include:
          - variant: pipewire
            features: ""
            pkg_deps: libpipewire-0.3-dev libspa-0.2-dev
          - variant: alsa
            features: "--no-default-features --features alsa"
            pkg_deps: ""
    steps:
    - uses: actions/checkout@v4
    - name: Install dependencies (Linux)
      run: |
        sudo apt-get update
        sudo apt-get install -y pkg-config ${{ matrix.pkg_deps }}
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: x86_64-unknown-linux-gnu
    - name: Build release binary
      run: cargo build --verbose --release --target x86_64-unknown-linux-gnu ${{ matrix.features }}
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: l337-audio-server-x86_64-linux-${{ matrix.variant }}
        path: |
          target/x86_64-unknown-linux-gnu/release/l337-audio-server
        retention-days: 90

  build-windows:
    name: Build - x86_64-pc-windows-msvc
    runs-on: windows-latest
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.target == 'all' || github.event.inputs.target == 'x86_64-pc-windows-msvc' }}
    continue-on-error: true
    steps:
    - uses: actions/checkout@v4
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: x86_64-pc-windows-msvc
    - name: Build release binary
      run: cargo build --verbose --release --target x86_64-pc-windows-msvc --no-default-features
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: l337-audio-server-x86_64-pc-windows-msvc
        path: |
          target/x86_64-pc-windows-msvc/release/l337-audio-server.exe
          target/x86_64-pc-windows-msvc/release/*.pdb
        retention-days: 90

  build-macos:
    name: Build - x86_64-apple-darwin
    runs-on: macos-latest
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.target == 'all' || github.event.inputs.target == 'x86_64-apple-darwin' }}
    continue-on-error: true
    steps:
    - uses: actions/checkout@v4
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: x86_64-apple-darwin
    - name: Build release binary
      run: cargo build --verbose --release --target x86_64-apple-darwin --no-default-features
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: l337-audio-server-x86_64-apple-darwin
        path: |
          target/x86_64-apple-darwin/release/l337-audio-server
        retention-days: 90

  build-android:
    name: Build - aarch64-linux-android (${{ matrix.variant }})
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.target == 'all' || github.event.inputs.target == 'aarch64-linux-android' }}
    continue-on-error: true
    strategy:
      matrix:
        variant: [native, termux]
    steps:
    - uses: actions/checkout@v4
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: aarch64-linux-android
    - name: Install Android NDK
      run: |
        sudo apt-get update
        sudo apt-get install -y unzip
        NDK_VERSION=r28b
        wget -q https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip
        unzip -q android-ndk-${NDK_VERSION}-linux.zip
        echo "$(pwd)/android-ndk-${NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH
        echo "CC_aarch64-linux-android=$(pwd)/android-ndk-${NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android29-clang" >> $GITHUB_ENV
        echo "CXX_aarch64-linux-android=$(pwd)/android-ndk-${NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android29-clang++" >> $GITHUB_ENV
        echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$(pwd)/android-ndk-${NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android29-clang" >> $GITHUB_ENV
    - name: Build release binary
      run: |
        if [ "${{ matrix.variant }}" = "termux" ]; then
          cargo build --verbose --release --target aarch64-linux-android --features pulseaudio
        else
          cargo build --verbose --release --target aarch64-linux-android
        fi
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.variant == 'native' && 'l337-audio-server-aarch64-android' || 'l337-audio-server-aarch64-android-termux' }}
        path: |
          target/aarch64-linux-android/release/l337-audio-server
        retention-days: 90

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build-linux, build-windows, build-macos, build-android]
    if: ${{ github.event_name != 'pull_request' && always() }}
    continue-on-error: true
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    - name: Set release tag
      id: release_tag
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          echo "tag=nightly-${{ github.run_number }}" >> $GITHUB_OUTPUT
          echo "name=Nightly Build #${{ github.run_number }}" >> $GITHUB_OUTPUT
        else
          echo "tag=nightly-${{ github.sha }}" >> $GITHUB_OUTPUT
          echo "name=Nightly Build ${{ github.sha }}" >> $GITHUB_OUTPUT
        fi
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: ./release-artifacts
    - name: Rename binaries with target triple
      run: |
        find ./release-artifacts -type f ! -name '*.d' | while read -r f; do
          dir=$(dirname "$f")
          base=$(basename "$f")
          target=$(basename "$dir")
          ext=""
          case "$base" in
            *.exe) ext=".exe" ;;
          esac
          newname="${target}${ext}"
          mv "$f" "$dir/$newname"
          echo "Renamed: $base -> $newname"
        done
    - name: Inspect downloaded artifacts
      run: |
        echo "Artifacts downloaded:"
        find ./release-artifacts -type f -exec ls -lh {} \;
    - name: Create GitHub Release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release create "${{ steps.release_tag.outputs.tag }}" \
          --title "${{ steps.release_tag.outputs.name }}" \
          --prerelease \
          --generate-notes \
          $(find ./release-artifacts -type f -printf '%p ')
