name: Build Release Binaries

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      target:
        description: 'Build target (or "all")'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - x86_64-unknown-linux-gnu
          - x86_64-pc-windows-msvc
          - x86_64-apple-darwin
          - aarch64-linux-android

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build - ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    if: ${{ github.event.inputs.target == 'all' || github.event.inputs.target == matrix.target || github.event_name != 'workflow_dispatch' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-linux-android
            os: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y pkg-config libpipewire-0.3-dev libspa-0.2-dev

    - name: Setup Android NDK
      if: matrix.target == 'aarch64-linux-android'
      run: |
        echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV
        rustup target add aarch64-linux-android

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}

    - name: Build release binary
      run: cargo build --verbose --release --target ${{ matrix.target }}

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: l337-audio-server-${{ matrix.target }}
        path: |
          target/${{ matrix.target }}/release/l337-audio-server*
          target/${{ matrix.target }}/release/*.pdb
        retention-days: 90
